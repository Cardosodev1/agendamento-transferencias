spring.application.name=agendamento-transferencias
server.port=8080

# Banco em memoria (H2)
spring.datasource.url=jdbc:h2:mem:transferencias;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# JSON: datas no formato ISO (yyyy-MM-dd) e falha em campos desconhecidos
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=true

# Encerramento gracioso: conclui as requisicoes em andamento ao receber SIGTERM
server.shutdown=graceful

# Actuator: expoe somente o health check (usado pelo Docker)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
