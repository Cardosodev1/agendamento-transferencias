name: agendamento-transferencias

services:
  backend:
    build:
      context: ./backend
    image: agendamento-transferencias/backend:latest
    restart: unless-stopped
    # Porta publicada só no localhost: o acesso normal é pelo frontend (/api).
    # Útil para testar a API direto e para o console do H2.
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      # O host acessa o console do H2 de fora do container
      SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS: "true"
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    image: agendamento-transferencias/frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:8080"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    security_opt:
      - no-new-privileges:true
